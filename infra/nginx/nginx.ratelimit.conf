# VARIANTE "con rate limit" (solo experimento C1 con): igual que nginx.conf + limit_req global de 250 req/s y ráfaga 100
# (perfil M, protocolo común §3). Se monta con docker-compose.ratelimit.yml; el resto de experimentos usa nginx.conf.
# Balanceador del Portal B2B · Entregable 3
# least_conn: cada solicitud va a la instancia con menos conexiones activas (diseño de la Entrega 1).
# Health check pasivo (nginx OSS): una instancia con max_fails errores en fail_timeout sale de la rotación por
# fail_timeout segundos. Los POST no se reenvían a otra instancia (nginx no reintenta métodos no idempotentes);
# la seguridad de reintentar la da la Idempotency-Key.
worker_processes auto;
events { worker_connections 4096; }

http {
    log_format json escape=json '{"ts":"$time_iso8601","servicio":"nginx","metodo":"$request_method",'
                                '"uri":"$request_uri","codigo":$status,"duracion_s":$request_time,'
                                '"upstream":"$upstream_addr","upstream_codigo":"$upstream_status",'
                                '"upstream_duracion_s":"$upstream_response_time","trace_id":"$http_x_trace_id"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Una sola clave constante: el límite es global (toda la carga viene de un único generador)
    limit_req_zone $server_name zone=portal:1m rate=250r/s;
    limit_req_status 503;

    upstream portal {
        least_conn;
        server app1:8000 max_fails=3 fail_timeout=10s;
        server app2:8000 max_fails=3 fail_timeout=10s;
        server app3:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            limit_req zone=portal burst=100 nodelay;
            proxy_pass http://portal;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;
        }

        # Métricas propias de nginx (conexiones activas, aceptadas, atendidas) para el relevo de observabilidad
        location = /nginx_status {
            stub_status;
            access_log off;
        }
    }
}
