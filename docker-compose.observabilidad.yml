# Observabilidad del Entregable 3 (Relevo 3). Se superpone al docker-compose.yml principal:
#   make obs-up      -> Prometheus, Grafana, cAdvisor, postgres_exporter, nginx_exporter y Jaeger
#   make obs-down    -> los detiene (hacerlo SIEMPRE antes de medir la línea base oficial)
# Comparte la red del proyecto con la plataforma (por eso se invoca con ambos -f, ver Makefile).
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: portal-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=48h
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: portal-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/portal-b2b.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: portal-cadvisor
    restart: unless-stopped
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=5s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8081:8080"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: portal-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:portal@db:5432/portal_b2b?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: portal-nginx-exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:80/nginx_status"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: portal-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "127.0.0.1:16686:16686"   # UI de trazas
