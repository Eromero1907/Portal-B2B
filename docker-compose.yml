# docker-compose.yml — PostgreSQL del proyecto (Entregable 2) + plataforma del Entregable 3
# `make db-up` lo levanta y espera a que esté sano. Todo el flujo (`make datos`) solo necesita Docker:
# psql corre dentro de este contenedor con el repo montado en /workspace (ver datos/psql.sh).
#
# Parámetros del servidor declarados aquí porque las mediciones (p50/p95/p99) dependen de ellos:
#   shared_buffers / effective_cache_size  memoria para caché de páginas (afecta "frío" vs "caliente")
#   work_mem                               memoria por sort/hash de Q4
#   max_wal_size                           evita checkpoints forzados durante la carga masiva
#   track_io_timing                        muestra I/O read time en EXPLAIN (ANALYZE, BUFFERS)
# Se dejan por defecto (a propósito): fsync=on, synchronous_commit=on, random_page_cost=4. Así el INSERT fila
# por fila con autocommit paga su costo real de commit y los planes son los del planeador sin ajustes.
services:
  db:
    image: postgres:16
    container_name: pg-portal-b2b
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: portal        # solo desarrollo local; el puerto no debe exponerse fuera de tu máquina
    ports:
      - "127.0.0.1:5433:5432"          # acceso desde el host: localhost:5433 (usuario postgres, base portal_b2b)
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=32MB
      - -c
      - max_wal_size=2GB
      - -c
      - track_io_timing=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - .:/workspace:ro                # CSV, modelo-fisico.sql y consultas visibles para psql \copy y -f
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # =====================================================================
  # Plataforma del Entregable 3 (`make plataforma`): 3 instancias del monolito modular + nginx + stub externo
  # =====================================================================
  app1: &app
    build: ./app
    image: portal-b2b-app:e3
    container_name: portal-app1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      stub-credito:
        condition: service_started
    environment: &app_env
      INSTANCIA: app1
      BD_DSN: postgresql://postgres:portal@db:5432/portal_b2b
      BD_POOL_MIN: "4"
      BD_POOL_MAX: "10"
      BD_POOL_TIMEOUT_S: "10"
      CREDITO_URL: http://stub-credito:9000
      CREDITO_TIMEOUT_S: "30"
      RESERVA_TTL_S: "60"
      FECHA_OPERACION: "2026-09-17"
    ports:
      - "127.0.0.1:8001:8000"          # /metrics y acceso directo a la instancia (diagnóstico)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 12

  app2:
    <<: *app
    container_name: portal-app2
    environment:
      <<: *app_env
      INSTANCIA: app2
    ports:
      - "127.0.0.1:8002:8000"

  app3:
    <<: *app
    container_name: portal-app3
    environment:
      <<: *app_env
      INSTANCIA: app3
    ports:
      - "127.0.0.1:8003:8000"

  stub-credito:
    build: ./stub
    image: portal-b2b-stub:e3
    container_name: portal-stub-credito
    restart: unless-stopped
    environment:
      LATENCIA_BASE_MS: "20"
      PORCENTAJE_SIN_CUPO: "3"
    ports:
      - "127.0.0.1:9000:9000"

  nginx:
    image: nginx:1.27-alpine
    container_name: portal-nginx
    restart: unless-stopped
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:80"           # punto de entrada del portal: http://localhost:8080

  # Herramientas (no arrancan con `up`): generador de carga y pruebas de aceptación de la plataforma
  carga:
    build: ./carga
    image: portal-b2b-carga:e3
    profiles: ["herramientas"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      BD_DSN: postgresql://postgres:portal@db:5432/portal_b2b
      PORTAL_URL: http://nginx:80
    volumes:
      - .:/workspace
    working_dir: /workspace

volumes:
  pgdata:
